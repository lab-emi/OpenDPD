# Install as /etc/tmpfiles.d/opendpd-gpu.conf.
# opendpd-gpu.service names these root Podman and runc runtime directories in
# ReadWritePaths=. systemd refuses to start a unit when such a path is missing
# (status=226/NAMESPACE), and ProtectSystem=strict keeps the agent from creating
# them itself. /run is empty after a reboot, so create them during early boot
# with the modes Podman and runc use.
d /run/containers 0700 root root -
d /run/libpod 0751 root root -
d /run/runc 0700 root root -
