name: Publish to PyPI

# Publishes the opendpd distribution to PyPI whenever a GitHub Release is
# published. Authentication uses PyPI Trusted Publishing (OIDC) — there is no
# API token stored in this repository. Configure the trusted publisher once at:
#   https://pypi.org/manage/project/opendpd/settings/publishing/
#     Owner:        lab-emi
#     Repository:   OpenDPD
#     Workflow:     publish.yml
#     Environment:  pypi
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      # For a real release, make sure the tag someone created matches the
      # version baked into the package, so we never publish a mislabelled
      # wheel. Accepts both "2.1.0" and "v2.1.0" tag styles.
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          tag="${tag#v}"
          pkg="$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('opendpd/__init__.py').read_text()).group(1))")"
          echo "release tag     = ${tag}"
          echo "package version = ${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::Release tag (${tag}) does not match opendpd.__version__ (${pkg}). Aborting publish."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Wheels are self-contained: the React workbench is built here and
      # shipped as opendpd/studio/static, so users never need Node.js.
      - name: Build the Studio frontend
        run: cd frontend && npm ci && npm run build

      - name: Build sdist and wheel
        run: python -m build

      - name: Wheel carries the built frontend
        run: python -c "import glob, zipfile; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'opendpd/studio/static/index.html' in n"

      - name: Validate distribution metadata
        run: |
          twine check dist/*
          python scripts/check_distribution.py

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The publisher is scoped to this environment on the PyPI side; keeping it
    # in its own job means only this job ever holds the OIDC id-token.
    environment:
      name: pypi
      url: https://pypi.org/project/opendpd/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
