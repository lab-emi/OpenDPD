name: Publish to PyPI

# Publishes the opendpd distribution to PyPI whenever a GitHub Release is
# published. Authentication uses PyPI Trusted Publishing (OIDC) — there is no
# API token stored in this repository. Configure the trusted publisher once at:
#   https://pypi.org/manage/project/opendpd/settings/publishing/
#     Owner:        lab-emi
#     Repository:   OpenDPD
#     Workflow:     publish.yml
#     Environment:  pypi
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      # For a real release, make sure the tag someone created matches the
      # version baked into the package, so we never publish a mislabelled
      # wheel. Accepts both "2.1.0" and "v2.1.0" tag styles.
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          pkg="$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('opendpd/__init__.py').read_text()).group(1))")"
          echo "release tag     = ${tag}"
          echo "package version = ${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::Release tag (${tag}) does not match opendpd.__version__ (${pkg}). Aborting publish."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Wheels are self-contained: the React workbench is built here and
      # shipped as opendpd/studio/static, so users never need Node.js.
      - name: Build the Studio frontend
        run: cd frontend && npm ci && npm run build

      - name: Build sdist and wheel
        run: python -m build

      - name: Wheel carries the built frontend
        run: python -c "import glob, zipfile; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'opendpd/studio/static/index.html' in n"

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The publisher is scoped to this environment on the PyPI side; keeping it
    # in its own job means only this job ever holds the OIDC id-token.
    environment:
      name: pypi
      url: https://pypi.org/project/opendpd/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
