name: Deployment dependency audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit --strict --no-deps --disable-pip -s osv -r deployment/web/requirements-vm.lock
      - run: pip-audit --strict --no-deps --disable-pip -s osv -r deployment/web/requirements-gpu.lock
