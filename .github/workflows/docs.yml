name: Docs

# Builds the MkDocs site (strict: warnings fail the build) on pushes and pull requests, and deploys it to
# GitHub Pages from main. Pages must be configured to deploy from GitHub Actions (Settings > Pages).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the public Studio (static frontend only)
        working-directory: frontend
        env:
          VITE_STUDIO_MODE: web
          VITE_API_ORIGIN: ${{ vars.STUDIO_API_ORIGIN || 'https://api.opendpd.com' }}
          VITE_BASE_PATH: ./
        run: npm ci && npm run build
      - name: Link the documentation preview to the canonical Studio
        run: |
          mkdir -p site/studio
          cat > site/studio/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://opendpd.com/studio/"><title>OpenDPD Studio</title><a href="https://opendpd.com/studio/">Open OpenDPD Studio</a>
          HTML
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
