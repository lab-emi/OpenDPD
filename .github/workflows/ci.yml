name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR updates, but let pushes to main finish so
  # the README badge always reflects a completed run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (critical errors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      # Fail the build on syntax errors, undefined names, and other
      # bugs that would crash at runtime (E9, F63, F7, F82).
      - name: Check for critical errors
        run: >
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          --exclude=.git,__pycache__,Matlab,datasets/MATLAB,papers,pics,build,dist

      # Full style report is informational only (does not fail the build).
      - name: Full style report (informational)
        run: >
          flake8 . --count --exit-zero --max-line-length=127 --statistics
          --exclude=.git,__pycache__,Matlab,datasets/MATLAB,papers,pics,build,dist

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      TQDM_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # desktop: the window module's import path and availability probe run headless here.
      - name: Install OpenDPD
        run: pip install -e ".[dev,gui,desktop]"

      # The packaging layer (tests/packaging) checks that the wheel carries the
      # built frontend and that `opendpd gui` serves it from a clean venv.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the Studio frontend
        run: cd frontend && npm ci && npm run build

      - name: Run unit and smoke tests
        run: pytest tests/ -v -m "not extended" --durations=10

      - name: API contract is committed (docs/contracts/openapi.json)
        run: python scripts/export_openapi.py --check

  frontend:
    name: Frontend (types, lint, unit, build, browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated API types match docs/contracts/openapi.json
        run: npm run types:check

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and interaction tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser journeys and accessibility audit on Chromium, Firefox and WebKit (mock API; visual baselines are compared locally)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test --ignore-snapshots

  build:
    name: Build & check distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the Studio frontend
        run: cd frontend && npm ci && npm run build

      - name: Build sdist and wheel
        run: python -m build

      # Validates long_description rendering and distribution metadata the
      # same way PyPI does on upload — a broken pyproject fails here, not
      # after a release tag has already been pushed.
      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Wheel and sdist carry the built frontend
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "opendpd/studio/static/index.html" in names, names[:20]
          assert any(n.startswith("opendpd/studio/static/assets/") for n in names)
          assert "opendpd/studio/static/build-info.json" in names
          sdist = glob.glob("dist/*.tar.gz")[0]
          snames = tarfile.open(sdist).getnames()
          assert any(n.endswith("opendpd/studio/static/index.html") for n in snames), snames[:20]
          print("frontend present in", wheel, "and", sdist)
          PY

      # Guard against pyproject `version` and opendpd.__version__ drifting
      # apart — the publish workflow trusts the tag against __version__.
      - name: Check version consistency
        run: |
          set -euo pipefail
          pkg_version="$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('opendpd/__init__.py').read_text()).group(1))")"
          wheel_version="$(ls dist/*.whl | sed -E 's|.*/opendpd-([^-]+)-.*|\1|')"
          echo "opendpd.__version__ = ${pkg_version}"
          echo "built wheel version = ${wheel_version}"
          test "${pkg_version}" = "${wheel_version}"
