name: Weekly

on:
  schedule:
    # Every Monday at 03:00 UTC — regular health check of the full test
    # suite, independent of push activity.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    name: Extended tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    env:
      MPLBACKEND: Agg
      TQDM_DISABLE: "1"
      KMP_DUPLICATE_LIB_OK: "TRUE"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install OpenDPD
        run: pip install -e ".[dev,gui]"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Gives macOS automated evidence for the packaged service (not for a real browser launch).
      - name: Build the Studio frontend
        run: cd frontend && npm ci && npm run build

      # Runs the complete suite, including tests marked "extended"
      # (all-backbone training smoke tests and all-dataset E2E chains).
      - name: Run full test suite
        run: python -m pytest tests/ -v --durations=20

      # benchmark-v1, cpu_regression tier on the measured built-in data: 4 entries x 3 seeds under the smoke
      # budgets. The check is advisory until a maintainer approves the baseline (then it fails the job).
      - name: benchmark-v1 cpu_regression (statistical regression, advisory until the baseline is approved)
        if: matrix.os == 'ubuntu-latest'
        run: |
          plan=benchmark/regression/cpu-regression-dpa-200mhz/plan.json
          opendpd datasets import-builtin DPA_200MHz --workspace /tmp/bench-ws
          opendpd benchmark run "$plan" --workspace /tmp/bench-ws
          opendpd benchmark report "$plan" --workspace /tmp/bench-ws --out /tmp/bench-report.json --markdown /tmp/bench-report.md
          opendpd benchmark check /tmp/bench-report.json --baseline benchmark/regression/cpu-regression-dpa-200mhz/baseline.json
      - name: Upload the benchmark report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-v1-cpu-regression-report
          path: |
            /tmp/bench-report.json
            /tmp/bench-report.md

      # S13 platform evidence: the real service driven by real browsers (Chromium, Firefox, WebKit) through
      # the whole smoke journey (bootstrap → train → result → export). WebKit here is the Linux port, not Safari.
      - name: Live browser journey against the real service (three engines)
        if: matrix.os == 'ubuntu-latest'
        run: |
          umask 077
          opendpd gui --no-browser --workspace /tmp/live-ws --port 8765 > /tmp/live-gui.log 2>&1 &
          printf '%s\n' "$!" > /tmp/live-gui.pid
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/readyz >/dev/null && break; sleep 1; done
          export OPENDPD_LIVE_URL="$(python -c "import json; print(json.load(open('/tmp/live-ws/.studio.lock'))['url'])")"
          cd frontend && npx playwright install --with-deps chromium firefox webkit
          npx playwright test e2e/live.spec.ts --project=chromium-1366 --project=firefox-1366 --project=webkit-1366
      # The launcher log contains a bootstrap URL. Keep it off public CI logs.
      - name: Stop the live journey server
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          if [ -f /tmp/live-gui.pid ]; then
            kill "$(cat /tmp/live-gui.pid)" 2>/dev/null || true
          fi
