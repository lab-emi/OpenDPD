name: Protected paths

# Required head-bound review status; repository rulesets require independent-review.
# Run only trusted base-branch code; never checkout or execute the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: independent-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check independent human or agent approval of the current head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/check_protected_review.py
