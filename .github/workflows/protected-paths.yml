name: Protected paths

# Advisory check. Repository rulesets must require Code Owner approval.
# Run only trusted base-branch code; never checkout or execute the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check changed paths and current-head maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/check_protected_review.py
