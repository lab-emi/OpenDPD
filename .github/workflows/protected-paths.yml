name: Protected paths

# Protected changes require a maintainer review bound to the current head.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect protected-path changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"
          changed="$(git diff --name-only "$base" "$head")"
          echo "$changed"
          protected='^(tests/golden/|opendpd/core/metrics/|opendpd/core/splits\.py|benchmark/|docs/protocols/|\.github/CODEOWNERS|\.github/workflows/|deployment/|pyproject\.toml|opendpd/web/)'
          if echo "$changed" | grep -Eq "$protected"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require current-head maintainer review
        if: steps.detect.outputs.touched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_protected_review.py
