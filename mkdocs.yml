# OpenDPD documentation site: MkDocs + Material, deployed to GitHub Pages by .github/workflows/docs.yml.
#
# README holds the short landing snippets; detailed guides live under docs/.
# Dataset, example and benchmark pages include their canonical repository sources.
# See docs/documentation.md for ownership, links and screenshot maintenance.
# docs/hooks/assets.py publishes shared images without copying them into docs/.
#
# Preview locally:  pip install -r docs/requirements.txt && mkdocs serve
# CI builds with:   mkdocs build --strict

site_name: OpenDPD
site_description: Open-source end-to-end learning and benchmarking framework for wideband power amplifier modeling and digital pre-distortion
site_url: https://lab-emi.github.io/OpenDPD/
repo_url: https://github.com/lab-emi/OpenDPD
repo_name: lab-emi/OpenDPD
edit_uri: ""
copyright: Copyright &copy; Lab of Efficient Machine Intelligence, Delft University of Technology &middot; Apache-2.0

theme:
  name: material
  logo: frontend/src/assets/opendpd-studio-mark.svg
  favicon: frontend/public/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Get started:
      - Installation: install.md
      - First Studio experiment: tutorials/gui-quickstart.md
      - Headless CLI: tutorials/headless-cli.md
      - Python examples & Colab: examples.md
  - Core workflow:
      - PA and DPD training: training.md
      - Studio CUDA performance: performance/studio-2.2.1.md
      - Datasets: datasets.md
      - Visualization: visualization.md
      - API reference: api.md
  - Research & deployment:
      - Choose a workflow: advanced.md
      - Benchmark: benchmark/index.md
      - Reproduce published results: reproducing.md
      - Add a model: tutorials/adding-a-model.md
      - Waveform evaluation: tutorials/waveform-evaluation.md
      - Measured DPD: tutorials/measured-dpd.md
      - Adaptation experiments: tutorials/adaptation-benchmark.md
      - Streaming: tutorials/streaming.md
      - Deployment export: tutorials/deployment-export.md
      - Leaderboard submission: tutorials/leaderboard-submission.md
  - Project:
      - What's new: whats-new.md
      - Team and research: about.md
      - Citation: community/citation.md
      - FAQ: faq.md
      - Testing and CI: testing.md
      - Maintaining documentation: documentation.md
      - Hosting the public Studio: architecture/public-studio.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            members_order: source

hooks:
  - docs/hooks/assets.py

exclude_docs: |
  hooks/
  requirements.txt
  # Local validation reports refer to raw captures deliberately excluded from Git.
  # Keep them in the repository; they are not pages in the published user guide.
  baseline/
  superpowers/

# Auxiliary references remain available through links from the Studio guides.
# Keep the primary navigation focused on the user workflows above.
not_in_nav: |
  architecture/**
  community/**
  design/**
  leaderboard/**
  protocols/**
  releases/**

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lab-emi/OpenDPD
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/opendpd/
    - icon: fontawesome/brands/youtube
      link: https://youtu.be/n3765lm3QZI
    - icon: material/web
      link: https://www.tudemi.com

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
