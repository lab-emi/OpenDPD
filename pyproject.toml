[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "opendpd"
version = "2.2.2"
description = "An end-to-end learning framework for modeling power amplifiers and digital pre-distortion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chang Gao", email = "chang.gao@tudelft.nl"},
    {name = "Yizhuo Wu", email = "yizhuo.wu@tudelft.nl"},
    {name = "Ang Li", email = "a.li-2@tudelft.nl"},
]
maintainers = [
    {name = "Chang Gao", email = "chang.gao@tudelft.nl"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4.0",
    "numpy>=2.0.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    # Pillow is imported directly for the v2.1 GIF-animation feature
    # (utils/plotting.py). matplotlib pulls it in transitively, but we
    # depend on it explicitly since we import PIL ourselves.
    "pillow>=9.0.0",
    "tqdm>=4.62.0",
    "rich>=10.0.0",
    # Versioned data contracts (opendpd/schemas) shared by CLI, API and GUI.
    # See docs/architecture/adr/0001-studio-technical-stack.md.
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# OpenDPD Studio: local FastAPI server + prebuilt browser workbench (`opendpd gui`).
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
]
# Native application window for `opendpd gui` (pywebview: WKWebView on macOS, WebView2 on
# Windows, WebKit2GTK or Qt on Linux). Pure Python; the browser stays the fallback.
desktop = [
    "opendpd[gui]",
    "pywebview>=6.2,<7",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.9",
    # Packaging tools used to build and validate the distribution locally
    # (the same commands run in CI and the publish workflow).
    "build>=1.0",
    "twine>=4.0",
    # HTTP client used by the API tests (FastAPI TestClient).
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/lab-emi/OpenDPD"
Documentation = "https://lab-emi.github.io/OpenDPD/"
Repository = "https://github.com/lab-emi/OpenDPD"
Issues = "https://github.com/lab-emi/OpenDPD/issues"

[project.scripts]
opendpd-cli = "opendpd.cli:main"
opendpd = "opendpd.cli:studio_main"

[tool.setuptools]
py-modules = ["arguments", "project", "models", "main"]

[tool.setuptools.packages.find]
include = [
    "opendpd",
    "opendpd.*",
    "modules",
    "modules.*",
    "steps",
    "steps.*",
    "utils",
    "utils.*",
    "quant",
    "quant.*",
    "backbones",
    "backbones.*",
    "datasets",
    "datasets.*"
]

[tool.setuptools.package-data]
datasets = ["*/spec.json", "*/*.csv"]
# Built frontend (frontend/ -> opendpd/studio/static via `npm run build`); the
# release workflow builds it before `python -m build` so wheels are self-contained.
"opendpd.studio" = ["static/*", "static/assets/*", "locales/*.json", "icon.png", "icon.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "extended: long-running tests executed only by the scheduled Weekly workflow",
    "integration: L1 tests that run a real worker process or a real HTTP server",
    "packaging: L2 tests that build and install the wheel in a clean environment",
]
